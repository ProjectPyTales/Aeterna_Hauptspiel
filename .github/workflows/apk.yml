# Baut bei jedem Push die signierte Test-APK und stellt sie unter "Artifacts" zum Download bereit.
# Parallel prüft die Sichtprüfung (AP 2.6) den Klickpfad im Handyformat gegen die Referenzbilder,
# und ein verkürzter Balance-Lauf (AP 5.1) misst die Siegquoten der Helden.
name: Test-APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Werkzeuge installieren
        run: pip install cryptography apksigtool

      - name: Tests (Kosmetik, Spielstand, ViewModels, Balance-Werkzeug, 100 simulierte Partien)
        run: node --test werkzeuge/tests/*.test.js

      - name: Version lesen
        id: version
        run: |
          read name code < <(python3 werkzeuge/manifest_version.py quellcode/AndroidManifest.xml)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Version $name (versionCode $code)"

      - name: APK bauen und signieren
        run: >-
          python3 werkzeuge/apk_bauen.py quellcode
          Aeterna-${{ steps.version.outputs.name }}-Test.apk
          werkzeuge/signatur/chroniken-test.p12 chroniken-test

      - name: Signatur prüfen
        run: apksigtool verify Aeterna-${{ steps.version.outputs.name }}-Test.apk | tee verify.txt && grep -q "v2 verified" verify.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Aeterna-${{ steps.version.outputs.name }}-Test-APK
          path: Aeterna-${{ steps.version.outputs.name }}-Test.apk
          compression-level: 0
          retention-days: 30

  sichtpruefung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Dieselbe Playwright-Version wie in den Claude-Code-Sitzungen, damit die Referenzbilder passen.
      - name: Playwright mit Chromium installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Klickpfad mit Referenzbildern (Menü → Basar → Sammlung → Match → Ergebnis)
        run: node werkzeuge/klickpfad.js

      - name: Messlauf Hauptmenü (Screenshots Handy und Tablet, Bildzeiten)
        run: node werkzeuge/sichtpruefung.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sichtpruefung
          path: sichtpruefung/
          retention-days: 14

  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Verkürzt: 20 statt 200 Partien je Paarung. Der volle Lauf steht in balance/BERICHT.md.
      - name: Balance-Lauf (KI gegen KI, alle Paarungen, Start- und Zufallsdecks)
        run: node werkzeuge/balance.js --partien 20 --bericht balance-ci/BERICHT.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Balance
          path: balance-ci/
          retention-days: 14
