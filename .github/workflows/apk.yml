# Baut bei jedem Push die signierte Test-APK (Gradle, native Hülle unter android/) und stellt sie unter "Artifacts" zum Download bereit.
# Parallel prüft die Sichtprüfung (AP 2.6) den Klickpfad im Handyformat gegen die Referenzbilder,
# und ein verkürzter Balance-Lauf (AP 5.1) misst die Siegquoten der Helden.
name: Test-APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests (Spielstand, ViewModels, Regeln, Hülle, Balance-Werkzeug, 100 simulierte Partien)
        run: node --test werkzeuge/tests/*.test.js

      # Native Hülle (AP 2.1): Gradle-Projekt unter android/, das Web-Spiel kommt aus quellcode/assets.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version lesen
        id: version
        run: |
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Version $name"

      - name: APK mit Gradle bauen und signieren
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # Gleicher Schlüssel wie seit 1.3.0 (chroniken-test.p12), sonst gibt es kein Update über die Vorversion.
      - name: Paket-ID, Version und Signatur prüfen
        run: |
          apk=Aeterna-${{ steps.version.outputs.name }}-Test.apk
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/aapt2" dump badging "$apk" | head -1 | tee badging.txt
          grep -q "name='de.chroniken.helden.layout'" badging.txt
          grep -q "versionName='${{ steps.version.outputs.name }}'" badging.txt
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee verify.txt
          grep -qi "SHA-256 digest: 8d4ab16f74df55c6ea0c119e2074e02ee7aeb2e1262c2770fede660b29e9e509" verify.txt
          echo "APK-Größe: $(stat -c %s "$apk") Bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: Aeterna-${{ steps.version.outputs.name }}-Test-APK
          path: Aeterna-${{ steps.version.outputs.name }}-Test.apk
          compression-level: 0
          retention-days: 30

  sichtpruefung:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Dieselbe Playwright-Version wie in den Claude-Code-Sitzungen, damit die Referenzbilder passen.
      - name: Playwright mit Chromium installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Klickpfad mit Referenzbildern (Menü → Basar → Sammlung → Match → Ergebnis)
        run: node werkzeuge/klickpfad.js

      - name: Messlauf Hauptmenü (Screenshots Handy und Tablet, Bildzeiten)
        run: node werkzeuge/sichtpruefung.js

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Sichtpruefung
          path: sichtpruefung/
          retention-days: 14

  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Verkürzt: 20 statt 200 Partien je Paarung. Der volle Lauf steht in balance/BERICHT.md.
      - name: Balance-Lauf (KI gegen KI, alle Paarungen, Start- und Zufallsdecks)
        run: node werkzeuge/balance.js --partien 20 --bericht balance-ci/BERICHT.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Balance
          path: balance-ci/
          retention-days: 14
