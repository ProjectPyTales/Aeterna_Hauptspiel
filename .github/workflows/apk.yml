# Baut bei jedem Push die signierte Test-APK (Gradle, native Hülle unter android/) und prüft sie. Auf main ersetzt sie die
# Datei im Release „Test-APK“ (Tag test-apk) – Release-Dateien belegen keinen Actions-Speicher (Free: 0,5 GB, im Oktober 2026
# voll, vor allem durch je 40 MB Screenshots und eine APK je Push). Parallel prüft die Sichtprüfung (AP 2.6) den Klickpfad im
# Handyformat gegen die Referenzbilder (Screenshots nur, wenn etwas fehlschlägt), und ein verkürzter Balance-Lauf (AP 5.1)
# misst die Siegquoten der Helden.
name: Test-APK bauen

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    needs: [sichtpruefung, balance]
    runs-on: ubuntu-latest
    # contents: Release „Test-APK“ ersetzen; actions: alte Artefakte löschen.
    permissions:
      contents: write
      actions: write
    concurrency:
      group: test-apk-${{ github.ref }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests (Spielstand, ViewModels, Regeln, Hülle, Balance-Werkzeug, 100 simulierte Partien)
        run: node --test werkzeuge/tests/*.test.js

      # Native Hülle (AP 2.1): Gradle-Projekt unter android/, das Web-Spiel kommt aus quellcode/assets.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Version lesen
        id: version
        run: |
          name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          code=$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' android/app/build.gradle.kts)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Version $name"

      - name: APK mit Gradle bauen und signieren
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # Gleicher Schlüssel wie seit 1.3.0 (chroniken-test.p12), sonst gibt es kein Update über die Vorversion.
      - name: Paket-ID, Version und Signatur prüfen
        run: |
          apk=Aeterna-${{ steps.version.outputs.name }}-Test.apk
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$tools/aapt2" dump badging "$apk" | head -1 | tee badging.txt
          grep -q "name='de.chroniken.helden.layout'" badging.txt
          grep -q "versionCode='${{ steps.version.outputs.code }}'" badging.txt
          grep -q "versionName='${{ steps.version.outputs.name }}'" badging.txt
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee verify.txt
          grep -qi "SHA-256 digest: 8d4ab16f74df55c6ea0c119e2074e02ee7aeb2e1262c2770fede660b29e9e509" verify.txt
          echo "APK-Größe: $(stat -c %s "$apk") Bytes"

      # Automatische Updates (seit 1.36.0): version.json mit Version, versionCode, „Was ist neu“ (model/neu.js), Größe und
      # SHA-256 der APK. Die App liest sie aus dem Release „Test-APK“ und bietet ein Update an, wenn versionCode höher ist.
      - name: version.json für die automatischen Updates schreiben
        run: node werkzeuge/update_info.js "Aeterna-${{ steps.version.outputs.name }}-Test.apk" version.json

      - name: Installierbaren Kandidaten zur Geräteabnahme bereitstellen
        if: github.ref == 'refs/heads/codex/aeterna-release-1-41'
        uses: actions/upload-artifact@v4
        with:
          name: Android-Kandidat
          path: |
            Aeterna-${{ steps.version.outputs.name }}-Test.apk
            version.json
          retention-days: 7

      # Nur main: eine einzige Test-APK im Release „Test-APK“, die jeder Lauf ersetzt (Tags von GITHUB_TOKEN starten keinen Lauf).
      # Mit ihr version.json – beide in einem Schritt, damit die Apps nie eine Datei ohne die andere sehen.
      - name: Release „Test-APK“ ersetzen (nur main)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk=Aeterna-${{ steps.version.outputs.name }}-Test.apk
          notes=$(node -p "require('./quellcode/assets/game/model/neu.js').notes")
          gh release delete test-apk --cleanup-tag --yes || true
          gh release create test-apk "$apk" version.json --target "$GITHUB_SHA" --prerelease \
            --title "Aeterna ${{ steps.version.outputs.name }} – Test-APK" \
            --notes "Signierte Test-APK von main (Commit ${GITHUB_SHA::7}). Ab 1.36.0 aktualisiert sich die App selbst (Hinweis im Hauptmenü, Einstellungen → Daten → Updates); sonst als Update über die Vorversion installieren.

          **Neu:** $notes"

      # Nur main: Artefakte älter als ein Tag löschen (früher APK 30 Tage, Screenshots 14 Tage) – hält den Actions-Speicher frei.
      - name: Alte Artefakte aufräumen (nur main)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            -q '.artifacts[] | select(.created_at < (now - 86400 | floor | todate)) | .id' |
            while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "gelöscht: $id"; done

  sichtpruefung:
    # Fest auf 24.04: ubuntu-latest ist seit Oktober 2026 Ubuntu 26.04, das Playwright 1.56.1 (Referenzbilder) nicht unterstützt.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Dieselbe Playwright-Version wie in den Claude-Code-Sitzungen, damit die Referenzbilder passen.
      - name: Playwright mit Chromium installieren
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Klickpfad mit Referenzbildern (Menü → Basar → Sammlung → Match → Ergebnis)
        run: node werkzeuge/klickpfad.js

      - name: Geräte-Testmatrix (1.34.0) – 16:9 bis 21:9 und Tablets, schwaches Gerät mit sparsamer Grafik
        run: node werkzeuge/geraetematrix.js

      - name: Start (1.26.0) – Entwickler-Splash PY'TALES und Intro bis ins Hauptmenü, Überspringen, reduzierte Bewegung
        run: node werkzeuge/intromessung.js

      - name: Messlauf Hauptmenü (Screenshots Handy und Tablet, Bildzeiten)
        run: node werkzeuge/sichtpruefung.js

      - name: Messlauf Match (AP 2.4, 7 Diener je Seite, volle Hand)
        run: node werkzeuge/matchmessung.js

      - name: Renderer-Labor (AP 2.5, Canvas 2D gegen PixiJS – ohne GPU nur Funktionsprobe)
        run: node werkzeuge/labormessung.js

      # Screenshots und Messwerte nur, wenn etwas fehlschlägt (je Lauf rund 40 MB). Ist der Actions-Speicher voll, scheitert nur
      # das Hochladen – die CI bleibt deshalb nicht rot (continue-on-error).
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: Sichtpruefung
          path: sichtpruefung/
          retention-days: 3

  html5:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: HTML5-ZIP bauen
        run: python3 werkzeuge/html5.py
      - name: Duellserver und Browser für die Paketprüfung installieren
        run: |
          npm ci --prefix relay
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Vollständiges Duell mit Wiederverbindung im entpackten ZIP
        run: node werkzeuge/freundesduell-test.js dist/Aeterna-*-HTML5.zip
      - name: Geprüftes itch.io-Paket bereitstellen
        if: github.ref == 'refs/heads/codex/aeterna-release-1-41' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: HTML5-fuer-itch
          path: dist/*-HTML5.zip
          retention-days: 7

  balance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Verkürzt: 20 statt 200 Partien je Paarung. Der volle Lauf steht in balance/BERICHT.md.
      - name: Balance-Lauf (KI gegen KI, alle Paarungen, Start- und Zufallsdecks)
        run: node werkzeuge/balance.js --partien 20 --bericht balance-ci/BERICHT.md

      # Bericht nur, wenn der Lauf scheitert; ein voller Actions-Speicher macht die CI nicht rot.
      - uses: actions/upload-artifact@v4
        if: failure()
        continue-on-error: true
        with:
          name: Balance
          path: balance-ci/
          retention-days: 3

  android-abnahme:
    if: github.ref == 'refs/heads/codex/aeterna-release-1-41'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Signierte APK und separate Instrumentierung bauen
        working-directory: android
        run: ./gradlew assembleRelease assembleReleaseAndroidTest -Pkotlin.compiler.execution.strategy=in-process --max-workers=2 --no-daemon
      - name: Tatsächliche Vorversion und Browserpaket vorbereiten
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p abnahme-alt
          gh release download test-apk -p version.json -D abnahme-alt
          curl -fL "$(jq -r .android.url abnahme-alt/version.json)" -o abnahme-alt/alt.apk
          echo "$(jq -r .android.sha256 abnahme-alt/version.json)  abnahme-alt/alt.apk" | sha256sum -c -
          python3 werkzeuge/html5.py
          npm ci --prefix relay
          npm install --no-package-lock --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
          node werkzeuge/update-spielstand.js abnahme-alt/alt.apk android/app/build/outputs/apk/release/app-release.apk
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Update, Neuinstallation und vollständiges WSS-Duell APK gegen ZIP
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          ram-size: 2304M
          heap-size: 384M
          cores: 2
          emulator-options: -no-window -gpu swiftshader_indirect -feature -Vulkan -noaudio -no-boot-anim -no-snapshot -writable-system -camera-back none
          script: bash werkzeuge/android-emulator-abnahme.sh --leeres-test-avd abnahme-alt/alt.apk android/app/build/outputs/apk/release/app-release.apk android/app/build/outputs/apk/androidTest/release/app-release-androidTest.apk dist/Aeterna-1.41.0-HTML5.zip
