<!doctype html><html lang="de"><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Aeterna – Renderer-Labor</title>
<style>
@font-face{font-family:Title;src:url('assets/title.ttf')}@font-face{font-family:Body;src:url('assets/body.ttf')}
html,body{margin:0;height:100%;background:#111;color:#f2dfaf;font:15px Body,sans-serif;overflow:hidden;touch-action:none}
#stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}#stage canvas{position:absolute;left:0;top:0;width:100%;height:100%}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:#0d0f12e0}
#bar button{font:inherit;color:#f2dfaf;background:#3c4647;border:1px solid #907750;border-radius:8px;padding:6px 10px}#bar button.on{background:#b48534;color:#211912}
#info{position:absolute;left:10px;top:8px;padding:6px 10px;border-radius:8px;background:#0d0f12d0;white-space:pre}
</style></head><body>
<div id="stage"><canvas id="c2d"></canvas><canvas id="gl"></canvas></div>
<div id="info">lädt …</div>
<div id="bar"><button data-r="canvas">Canvas 2D</button><button data-r="pixi">PixiJS (WebGL)</button>
<button data-s="0">Brett</button><button data-s="1">+ 500 Partikel, 4 Verformungen</button><button data-s="2">+ 2000 Partikel, 4 Verformungen</button>
<button data-run>Messreihe</button><button data-back>Zurück zum Spiel</button></div>
<script src="model/bilder.js"></script><script src="model/data.js"></script><script src="model/engine.js"></script>
<script src="view/match/layout.js"></script><script src="view/match/anim.js"></script><script src="view/stone.js"></script>
<script src="view/match/render.js"></script><script src="view/match/motion.js"></script><script src="view/match/fx.js"></script>
<script src="labor/pixi.min.js"></script><script src="labor/labor.js"></script>
</body></html>
